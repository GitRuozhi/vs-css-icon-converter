<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS to SVG Converter — icon comparison</title>
  <style>
    :root {
      color-scheme: light;
      --grid-line: #3f8ed0;
      --header: #203a55;
      --cell: #294967;
      --dark: #06111e;
      --dark-icon: #59b9ff;
      --light: #eef4f8;
      --light-icon: #185b91;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1180px; background: #fff; }
    main { width: 1320px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid var(--grid-line); }
    caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    th, td { padding: 9px 6px; border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); }
    tr > :last-child { border-right: 0; }
    tbody tr:last-child > * { border-bottom: 0; }
    th { min-height: 40px; background: var(--header); color: #f5f7fa; font: 600 11px/1.25 Consolas, monospace; overflow-wrap: anywhere; text-align: center; }
    th:first-child, th[scope="row"] { width: 76px; }
    th[scope="row"] { font: 600 12px/1.25 system-ui, sans-serif; }
    td { height: 86px; background: var(--cell); }
    .preview-pair { display: flex; justify-content: center; gap: 6px; }
    .preview-item { display: grid; width: 56px; height: 56px; place-items: center; }
    .preview-item.dark { background: var(--dark); color: var(--dark-icon); }
    .preview-item.light { background: var(--light); color: var(--light-icon); }
    .preview-item > .icon { transform: scale(2); }
    .preview-item > svg { width: 16px; height: 16px; color: inherit; fill: currentColor; overflow: visible; transform: scale(2); }
    .icon { position: relative; display: block; width: 16px; height: 16px; color: inherit; }

    /* CSS source icons */
    .icon-tick::before { content: ""; position: absolute; left: 5px; top: -1px; width: 4px; height: 11px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }

    .icon-broken-heart::before, .icon-broken-heart::after { content: ""; position: absolute; top: 2px; width: 6px; height: 12px; background: currentColor; }
    .icon-broken-heart::before { left: 3px; clip-path: polygon(0 0, 100% 0, 100% 65%, 30% 65%, 30% 100%, 0 100%); transform: rotate(-45deg); }
    .icon-broken-heart::after { left: 7px; clip-path: polygon(0 0, 100% 0, 100% 70%, 55% 70%, 55% 35%, 0 35%); transform: rotate(45deg); }

    .icon-awkward { top: -1px; width: 5px; height: 12px; border-bottom: 2px solid currentColor; }
    .icon-awkward::before, .icon-awkward::after { content: ""; position: absolute; top: 4px; width: 3px; height: 3px; border-right: 2px solid currentColor; border-top: 2px solid currentColor; }
    .icon-awkward::before { right: 7px; transform: rotate(45deg); }
    .icon-awkward::after { left: 7px; transform: rotate(-135deg); }

    .icon-link-connected::before, .icon-link-connected::after { content: ""; position: absolute; width: 8px; height: 4px; border: 2px solid currentColor; border-radius: 4px; }
    .icon-link-connected::before { left: 0; top: 3px; }
    .icon-link-connected::after { left: 4px; top: 6px; }

    .icon-download::before { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-bottom: 2px solid currentColor; }
    .icon-download::after { content: ""; position: absolute; inset: 0; margin: auto; top: -2px; width: 12px; height: 8px; background: currentColor; clip-path: polygon(0 50%, 67% 100%, 67% 67%, 100% 67%, 100% 33%, 67% 33%, 67% 0); transform: rotate(270deg); }

    .icon-volume::before { content: ""; position: absolute; top: 2px; left: 0; width: 8px; height: 12px; background: currentColor; clip-path: polygon(0 30%, 37.5% 30%, 100% 0, 100% 100%, 37.5% 70%, 0 70%); }
    .icon-volume::after { content: ""; position: absolute; top: 2px; left: 10px; width: 6px; height: 12px; background: linear-gradient(currentColor 0 0) 0 3px / 2px 6px no-repeat, linear-gradient(currentColor 0 0) 4px 0 / 2px 12px no-repeat; }

    .icon-audio-track::before { content: ""; position: absolute; inset: 0; width: 16px; height: 16px; background: linear-gradient(currentColor 0 0) 1px 4px / 2px 8px no-repeat, linear-gradient(currentColor 0 0) 5px 0 / 2px 16px no-repeat, linear-gradient(currentColor 0 0) 9px 3px / 2px 10px no-repeat, linear-gradient(currentColor 0 0) 13px 6px / 2px 4px no-repeat; }

    .icon-loop { width: 16px; height: 8px; border-left: 2px solid currentColor; border-right: 2px solid currentColor; }
    .icon-loop::before, .icon-loop::after { content: ""; position: absolute; width: 14px; height: 8px; background: currentColor; clip-path: polygon(0 65%, 50% 65%, 50% 100%, 100% 40%, 0 40%); }
    .icon-loop::before { bottom: 5px; right: 0; }
    .icon-loop::after { top: 5px; left: 0; transform: rotate(180deg); }
  </style>
</head>
<body>
  <main>
    <table>

      </thead>
      <tbody>
        <tr>

          <td><div class="preview-pair"><span class="preview-item dark"><span class="icon icon-broken-heart"></span></span><span class="preview-item light"><span class="icon icon-broken-heart"></span></span></div></td>

          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="broken-heart SVG"><path d="m-.364 5.879 4.243-4.243 5.515 5.515-2.97 2.97 2.97 2.97-1.273 1.273L-.364 5.879Zm12.485-4.243 4.243 4.243-5.94 5.939-1.909-1.909 2.97-2.97-2.334-2.333 2.97-2.97Z" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="broken-heart SVG"><path d="m-.364 5.879 4.243-4.243 5.515 5.515-2.97 2.97 2.97 2.97-1.273 1.273L-.364 5.879Zm12.485-4.243 4.243 4.243-5.94 5.939-1.909-1.909 2.97-2.97-2.334-2.333 2.97-2.97Z" /></svg></span></div></td>
          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="awkward SVG"><path d="M5.5 11h5v2h-5zM1 3.964 4.536 7.5 3.121 8.914-.414 5.379 1 3.964Zm2.121 2.122L4.536 7.5 1 11.036l-1.414-1.415 3.535-3.535Zm11.879 4.95L11.464 7.5l1.415-1.414 3.535 3.535-1.414 1.415Zm-2.121-2.122L11.464 7.5 15 3.964l1.414 1.415-3.535 3.535Z" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="awkward SVG"><path d="M5.5 11h5v2h-5zM1 3.964 4.536 7.5 3.121 8.914-.414 5.379 1 3.964Zm2.121 2.122L4.536 7.5 1 11.036l-1.414-1.415 3.535-3.535Zm11.879 4.95L11.464 7.5l1.415-1.414 3.535 3.535-1.414 1.415Zm-2.121-2.122L11.464 7.5 15 3.964l1.414 1.415-3.535 3.535Z" /></svg></span></div></td>
          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="link-connected SVG"><rect x="1" y="4" width="10" height="6" fill="none" stroke="currentColor" stroke-width="2" rx="3" /><rect x="5" y="7" width="10" height="6" fill="none" stroke="currentColor" stroke-width="2" rx="3" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="link-connected SVG"><rect x="1" y="4" width="10" height="6" fill="none" stroke="currentColor" stroke-width="2" rx="3" /><rect x="5" y="7" width="10" height="6" fill="none" stroke="currentColor" stroke-width="2" rx="3" /></svg></span></div></td>
          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="download SVG"><path d="M1 14h14v2H1zM8 13l4-8.04H9.36V1H6.64v3.96H4L8 13Z" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="download SVG"><path d="M1 14h14v2H1zM8 13l4-8.04H9.36V1H6.64v3.96H4L8 13Z" /></svg></span></div></td>
          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="volume SVG"><path d="M0 5.6h3L8 2v12l-5-3.6H0V5.6Zm10 0h2v6h-2V5.6Zm4-3h2v12h-2v-12Z" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="volume SVG"><path d="M0 5.6h3L8 2v12l-5-3.6H0V5.6Zm10 0h2v6h-2V5.6Zm4-3h2v12h-2v-12Z" /></svg></span></div></td>
          <td><div class="preview-pair"><span class="preview-item dark"><svg viewBox="0 0 16 16" aria-label="audio-track SVG"><path d="M1 4h2v8H1V4Zm4-4h2v16H5V0Zm4 3h2v10H9V3Zm4 3h2v4h-2V6Z" /></svg></span><span class="preview-item light"><svg viewBox="0 0 16 16" aria-label="audio-track SVG"><path d="M1 4h2v8H1V4Zm4-4h2v16H5V0Zm4 3h2v10H9V3Zm4 3h2v4h-2V6Z" /></svg></span></div></td>

        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
